[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = "3.11.*"
pytest = "*"
poetry = "*"

[pypi-dependencies]
volttron-core = { path = "../volttron-core", editable = true }
tent = { path = "../TENT", editable = true }
volttron-transactive-node-historian = { path = ".", editable = true }

[tasks]
# Build wheel
build = "poetry build"

# Test (no platform needed; see tests/conftest.py)
test = "pytest -v"

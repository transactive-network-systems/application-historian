[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = "3.11.*"
pytest = "*"
poetry = "*"

[pypi-dependencies]
volttron-core = { path = "../volttron-core", editable = true }
lib-archivable = { path = "../tns-utilities/lib-archivable", editable = true }
volttron-application-historian = { path = ".", editable = true }

[tasks]
# Build wheel
build = "poetry build"

# Test (no platform needed; see tests/conftest.py)
test = "pytest -v"

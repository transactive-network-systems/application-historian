[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "volttron-transactive-node-historian"
version = "3.0.0"
description = "A modular VOLTTRON historian backed by TENT LocalDataManager"
authors = ["VOLTTRON Team <volttron@pnnl.gov>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-volttron/volttron-transactive-node-historian"
homepage = "https://github.com/eclipse-volttron/volttron-transactive-node-historian"
keywords = ["volttron", "agent", "historian", "transactive", "TNS", "data-storage"]
packages = [
    { include = "historian", from = "src" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.poetry.dependencies]
python = "^3.11"
volttron-core = ">=2.0.0rc0"
volttron-lib-base-historian = { version = ">=2.0.0rc1", allow-prereleases = true }
# tent (code/TENT in this project) is required and is installed into the platform with `vctl install-lib` or
# `pip install -e ../TENT`; it is not on PyPI yet. It brings SQLAlchemy. See README.md.

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[tool.poetry.scripts]
volttron-transactive-node-historian = "historian.transactivate_node.transactive_node:main"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
